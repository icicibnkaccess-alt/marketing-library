    <script>
      // If anything fails to load, show it on the page instead of a blank screen.
      window.addEventListener('error', function (e) {
        var msg = e.message || ('Could not load ' + ((e.target && (e.target.src || e.target.href)) || 'a resource'));
        var box = document.getElementById('boot-error');
        if (!box) {
          box = document.createElement('pre');
          box.id = 'boot-error';
          box.style.cssText = 'margin:16px;padding:12px;background:#fff1f2;color:#9f1239;font:12px/1.5 monospace;white-space:pre-wrap;border-radius:8px';
          (document.body || document.documentElement).appendChild(box);
        }
        box.textContent += msg + '\n';
      }, true);
    </script>

}

function StatPill({ label, value, color }) {
  const c = colorOf(color);

      <div className=${`text-xl font-semibold leading-tight ${c.text}`}>${value}</div>

    </div>`;
}

/** Status badge for something that's out: Overdue › Due Today › Due Tomorrow › In Use / On Loan. */
function LoanBadge({ loan, kind }) {
  if (isOverdue(loan)) return html`<${Badge} tone="rose" icon="CircleAlert">Overdue</_>`;
  if (loan.dueDate === today()) return html`<${Badge} tone="orange" icon="Clock">Due Today</_>`;
  if (loan.dueDate === addDays(today(), 1)) return html`<${Badge} tone="amber" icon="Clock">Due Tomorrow</_>`;
  return html`<${Badge} tone="amber" icon="Clock">${kind === 'laptop' ? 'In Use' : 'On Loan'}</_>`;
}

function Badge({ tone, icon, children }) {
  const tones = {
    green: 'bg-emerald-100 text-emerald-700', amber: 'bg-amber-100 text-amber-700',
    rose: 'bg-rose-100 text-rose-700', stone: 'bg-stone-100 text-stone-600', orange: 'bg-orange-600 text-white',
  };
  return html`
    <span className=${`inline-flex items-center gap-1 px-2 py-1 rounded-full text-xs font-medium ${tones[tone]}`}>
      ${icon && html`<${Icon} name=${icon} size=${11} />`}${children}
    </span>`;
}

function LinkBtn({ onClick, icon, children, tone = 'stone' }) {
  const t = tone === 'rose' ? 'text-rose-600 hover:text-rose-700' : 'text-stone-500 hover:text-stone-800';
  return html`
    <button onClick=${onClick} className=${`inline-flex items-center gap-1 text-xs font-medium py-2 px-1 -my-1 ${t}`}>
      <${Icon} name=${icon} size=${12} /> ${children}
    </button>`;
}

function Modal({ children, onClose, wide }) {
  useEffect(() => {
    const onKey = (e) => e.key === 'Escape' && onClose();
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);
  return html`
    <div className="fixed inset-0 bg-black/40 z-50 flex items-end justify-center p-0"
      onMouseDown=${(e) => e.target === e.currentTarget && onClose()}>
      <div className=${`bg-white w-full max-w-[480px] ${wide ? '' : ''} rounded-t-2xl overflow-hidden shadow-2xl max-h-[90vh] max-h-[90dvh] flex flex-col pb-safe`}>
        ${children}
      </div>
    </div>`;
}

function ModalHeader({ grad, title, subtitle, onClose }) {

        <div className="text-lg font-semibold text-stone-900 leading-snug">${title}</div>
        ${subtitle && html`<div className="text-sm text-stone-500 truncate mt-0.5">${subtitle}</div>`}

// Book cover with a typographic fallback when there's no image (or it fails to load).
function Cover({ book, className = '', small }) {

    return html`<img src=${book.cover} alt=${book.title} loading="lazy" decoding="async" onError=${() => setFailed(true)}
      className=${`object-cover bg-stone-100 ${className}`} />`;
  const t = COVER_TINTS[hash(book.title) % COVER_TINTS.length];
  return html`

      style=${{ background: t.bg }}>
      <span className="absolute inset-x-0 top-0 h-1.5" style=${{ background: t.accent }} />
      <div className=${`font-semibold leading-snug text-stone-800 ${small ? 'text-[6px]' : 'text-[15px]'}`}>${book.title}</div>
      ${!small && html`
        <div className="mx-auto my-3 h-px w-8" style=${{ background: t.accent }} />
        <div className="text-[11px] leading-tight text-stone-500">${book.author}</div>`}
    </div>`;
}

  const overdue = isOverdue(active);
  const queue = ctx.queueFor('laptop', lap.id);
  const c = colorOf(lap.color);
  const nextName = queue.length ? firstName((ctx.empById(queue[0].employeeId) || {}).name) : '';
  return html`
    <div className=${`bg-white rounded-2xl border shadow-sm px-3 py-3 ${overdue ? 'border-rose-200' : 'border-stone-200'}`}>
      <div className="flex items-center gap-3">
        <div className=${`${c.light} w-10 h-10 rounded-xl flex items-center justify-center text-xl shrink-0`}>${lap.emoji}</div>
        <div className="min-w-0 flex-1">
          <div className="flex items-center gap-2 min-w-0">
            <span className="font-semibold text-stone-900 leading-tight truncate">${lap.name}</span>
            ${active && html`<${LoanBadge} loan=${active} kind="laptop" />`}
          </div>
          <div className="text-xs text-stone-500 truncate mt-0.5">
            ${active
              ? html`${emp ? emp.name : 'Unknown'} · <span className=${overdue ? 'text-rose-700 font-medium' : ''}>${overdue ? 'was due' : 'due'} ${fmt(active.dueDate)}</span>`
              : lap.repair
              ? html`<span className="text-stone-500">Under repair${lap.repair.toLowerCase() !== 'yes' && lap.repair.toLowerCase() !== 'under repair' ? ` · ${lap.repair}` : ''}</span>`

              ? html`<span className="text-amber-700">Reserved for ${nextName}${queue.length > 1 ? ` +${queue.length - 1}` : ''}</span>`
              : html`<span className="text-emerald-600">Available</span> · ${lap.tagline}`}
          </div>
        </div>
        ${active
          ? html`<button onClick=${() => ctx.doReturn('laptop', active)} disabled=${ctx.busy}
              className="shrink-0 h-10 px-3.5 bg-stone-900 hover:bg-stone-800 text-white rounded-lg font-medium text-sm disabled:opacity-60">Return</button>`
          : lap.repair
          ? html`<span className="shrink-0 h-10 px-3 rounded-lg bg-stone-100 text-stone-500 text-sm font-medium flex items-center gap-1.5"><${Icon} name="Wrench" size=${14} /> Repair</span>`
          : html`<button onClick=${() => ctx.openCheckout('laptop', lap)}
              className="shrink-0 h-10 px-3.5 bg-amber-600 hover:bg-amber-700 text-white rounded-lg font-medium text-sm">Check Out</button>`}
      </div>
      ${active && html`
        <div className="flex items-center gap-4 mt-1.5 pl-[52px]">
          <${LinkBtn} icon="CalendarPlus" onClick=${() => ctx.openExtend('laptop', active)}>Extend</_>
          ${overdue && html`<${LinkBtn} icon="Bell" tone="rose" onClick=${() => ctx.openRemind('laptop', active)}>Remind</_>`}
          <${LinkBtn} icon="ListOrdered" onClick=${() => ctx.openWaitlist('laptop', lap)}>${queue.length ? `Waitlist (${queue.length})` : 'Join Waitlist'}</_>
        </div>`}
    </div>`;
}

// ─── Employee picker ──────────────────────────────────────────────────────────
function EmployeePicker({ employees, value, onChange, placeholder = 'Search team members…', autoFocus }) {
  const [query, setQuery] = useState('');
  const [open, setOpen] = useState(false);
  const [hi, setHi] = useState(0);
  const selected = employees.find((e) => e.id === value);
  const filtered = useMemo(() => {
    const q = query.trim().toLowerCase();
    return q ? employees.filter((e) => e.name.toLowerCase().includes(q)) : employees;
  }, [employees, query]);
  const pick = (e) => { onChange(e.id); setQuery(''); setOpen(false); };
  return html`
    <div className="relative">
      <div className="relative">
        <span className="absolute left-3 top-1/2 -translate-y-1/2 text-stone-400 pointer-events-none"><${Icon} name="Search" size=${15} /></span>
        <input type="text" autoFocus=${autoFocus}
          value=${open ? query : (selected ? selected.name : '')}
          onChange=${(e) => { setQuery(e.target.value); setOpen(true); setHi(0); }}
          onFocus=${() => { setQuery(''); setOpen(true); setHi(0); }}
          onBlur=${() => setTimeout(() => setOpen(false), 150)}
          onKeyDown=${(e) => {
            if (e.key === 'ArrowDown') { e.preventDefault(); setHi((h) => Math.min(h + 1, filtered.length - 1)); }
            if (e.key === 'ArrowUp') { e.preventDefault(); setHi((h) => Math.max(h - 1, 0)); }
            if (e.key === 'Enter' && filtered[hi]) { e.preventDefault(); pick(filtered[hi]); e.target.blur(); }
          }}
          placeholder=${placeholder}
          className="w-full pl-9 pr-3 py-2.5 border border-stone-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm" />
      </div>
      ${open && html`
        <div className="absolute left-0 right-0 mt-1 max-h-56 overflow-y-auto bg-white border border-stone-200 rounded-xl shadow-lg z-20">
          ${filtered.length === 0
            ? html`<div className="px-3 py-2 text-sm text-stone-400">No matches</div>`
            : filtered.map((e, i) => html`
              <button key=${e.id} type="button" onMouseDown=${(ev) => ev.preventDefault()} onClick=${() => pick(e)}
                className=${`w-full text-left px-3 py-2 text-sm hover:bg-amber-50 transition-colors ${
                  e.id === value ? 'bg-amber-50 text-amber-700 font-medium' : i === hi && query ? 'bg-stone-50 text-stone-800' : 'text-stone-700'}`}>
                ${e.name}
              </button>`)}
        </div>`}
    </div>`;
}

// ─── Checkout / issue modal (laptops and books) ───────────────────────────────
function CheckoutModal({ ctx, kind, item, onClose }) {
  const isLaptop = kind === 'laptop';
  const queue = ctx.queueFor(kind, item.id);
  const defaultEmp = queue.length ? queue[0].employeeId : ctx.me && ctx.empById(ctx.me) ? ctx.me : '';
  const [employeeId, setEmployeeId] = useState(defaultEmp);
  const days = parseInt(isLaptop ? ctx.settings.laptopLoanDays : ctx.settings.bookLoanDays, 10) || (isLaptop ? 7 : 14);
  const [returnDate, setReturnDate] = useState(addDays(today(), days));
  const [purpose, setPurpose] = useState('');
  const [loading, setLoading] = useState(false);
  const c = isLaptop ? colorOf(item.color) : BOOK_COLOR;
  const jumpQueue = queue.length > 0 && employeeId && queue[0].employeeId !== employeeId;
  const remembered = !!ctx.me && employeeId === ctx.me;

  const submit = async () => {
    if (!employeeId) return;
    ctx.mutate('checkout', { kind, itemId: item.id, employeeId, dueDate: returnDate, note: purpose }, {
      undo: (r) => () => ctx.mutate('voidLoan', { kind, loanId: r.extra.loanId }, { message: isLaptop ? 'Checkout undone' : 'Issue undone' }),
    });
    if (!ctx.me) ctx.setMe(employeeId);
    onClose();
  };


  return html`
    <${Modal} onClose=${onClose}>
      <${ModalHeader} grad=${`${c.gradFrom} ${c.gradTo}`} onClose=${onClose}
        title=${isLaptop ? `${item.emoji} ${item.name}` : html`<span>${item.title}</span>`}
        subtitle=${isLaptop ? item.tagline : item.author} />
      <div className="p-5 space-y-4 overflow-y-auto">
        <${Field} label=${isLaptop ? 'Who’s Taking It?' : 'Who’s Borrowing It?'}>
          <${EmployeePicker} employees=${ctx.employees} value=${employeeId} onChange=${setEmployeeId} />
          ${remembered && html`
            <div className="mt-1.5 text-xs text-stone-500 flex items-center gap-1.5">
              <${Icon} name="Check" size=${12} className="text-emerald-600" /> Remembered on this phone.
              <button onClick=${() => { ctx.setMe(''); setEmployeeId(''); }} className="font-medium text-amber-700 py-1">Not You?</button>
            </div>`}
        </_>
        ${jumpQueue && html`
          <div className="text-xs bg-amber-50 border border-amber-200 text-amber-800 rounded-lg px-3 py-2 flex gap-2">
            <${Icon} name="Hourglass" size=${14} className="shrink-0 mt-0.5" />
            <span><b>${(ctx.empById(queue[0].employeeId) || {}).name}</b> is first on the waitlist (since ${fmt(queue[0].joinedAt)}). You can still go ahead.</span>
          </div>`}
        <${Field} label="Expected Return Date">
          <input type="date" value=${returnDate} min=${today()} onChange=${(e) => setReturnDate(e.target.value)} className=${inputCls} />
        </_>
        <${Field} label=${isLaptop ? 'Purpose' : 'Note'} hint="(optional)">
          <input type="text" value=${purpose} onChange=${(e) => setPurpose(e.target.value)}
            onKeyDown=${(e) => e.key === 'Enter' && submit()}
            placeholder=${isLaptop ? 'e.g. Campaign content with Midjourney' : 'e.g. Reading for the book club'} className=${inputCls} />
        </_>
        <${ModalButtons} onCancel=${onClose} onConfirm=${submit} disabled=${!employeeId || !returnDate} loading=${loading}
          label=${isLaptop ? 'Confirm Checkout' : 'Issue Book'} grad=${`${c.gradFrom} ${c.gradTo}`} />
      </div>
    </_>`;
}

function ExtendModal({ ctx, kind, loan, onClose }) {
  const item = ctx.itemById(kind, loan.itemId);
  const emp = ctx.empById(loan.employeeId);
  const base = loan.dueDate && loan.dueDate > today() ? loan.dueDate : today();
  const [date, setDate] = useState(addDays(base, kind === 'laptop' ? 2 : 7));
  const [loading, setLoading] = useState(false);
  const save = async () => {
    const oldDue = loan.dueDate;
    ctx.mutate('extend', { kind, loanId: loan.id, dueDate: date }, {
      undo: () => () => ctx.mutate('extend', { kind, loanId: loan.id, dueDate: oldDue < today() ? today() : oldDue }),
    });
    onClose();
  };
  return html`
    <${Modal} onClose=${onClose}>
      <${ModalHeader} grad="from-stone-700 to-stone-800" onClose=${onClose} title="Extend Due Date"
        subtitle=${`${itemLabel(kind, item)} · with ${emp ? emp.name : 'Unknown'}`} />
      <div className="p-5 space-y-4">
        <div className="text-sm text-stone-600">Currently due <b className=${isOverdue(loan) ? 'text-rose-700' : ''}>${fmtFull(loan.dueDate)}</b>${isOverdue(loan) ? ` (${daysLate(loan.dueDate)}d late)` : ''}</div>
        <div className="flex flex-wrap gap-2">
          ${[[2, '+2 Days'], [7, '+1 Week'], [14, '+2 Weeks']].map(([n, l]) => html`
            <button key=${n} onClick=${() => setDate(addDays(base, n))}
              className=${`px-3 py-1.5 rounded-full text-xs font-medium border ${date === addDays(base, n) ? 'bg-amber-100 border-amber-300 text-amber-800' : 'border-stone-200 text-stone-600 hover:bg-stone-50'}`}>${l}</button>`)}
        </div>
        <${Field} label="New Return Date">

// Horizontal chip row that shows a fade + arrow while more chips are off-screen.
function ChipRow({ children }) {
  const ref = useRef(null);
  const [edge, setEdge] = useState({ left: false, right: true });
  const update = () => {
    const el = ref.current;
    if (!el) return;
    setEdge({ left: el.scrollLeft > 4, right: el.scrollLeft + el.clientWidth < el.scrollWidth - 4 });
  };
  useEffect(() => { update(); }, [children]);
  const nudge = (dir) => ref.current && ref.current.scrollBy({ left: dir * 160, behavior: 'smooth' });
  return html`
    <div className="relative -mx-4">
      <div ref=${ref} onScroll=${update} className="flex gap-2 overflow-x-auto no-scrollbar px-4 py-0.5 scroll-px-4">
        ${children}
        <span className="shrink-0 w-6" />
      </div>
      ${edge.left && html`
        <button onClick=${() => nudge(-1)} aria-label="Scroll genres left"
          className="absolute left-0 top-0 bottom-0 w-14 flex items-center justify-start pl-2 bg-gradient-to-r from-stone-50 via-stone-50/90 to-transparent">
          <span className="w-8 h-8 rounded-full bg-white border border-stone-200 shadow-sm flex items-center justify-center text-stone-600"><${Icon} name="ChevronLeft" size=${16} /></span>
        </button>`}
      ${edge.right && html`
        <button onClick=${() => nudge(1)} aria-label="More genres"
          className="absolute right-0 top-0 bottom-0 w-16 flex items-center justify-end pr-2 bg-gradient-to-l from-stone-50 via-stone-50/90 to-transparent">
          <span className="w-8 h-8 rounded-full bg-white border border-stone-200 shadow-sm flex items-center justify-center text-stone-600"><${Icon} name="ChevronRight" size=${16} /></span>
        </button>`}
    </div>`;
}

function Library({ ctx }) {
  const { books, activeFor } = ctx;
  const [q, setQ] = useState('');
  const [genre, setGenre] = useState('');
  const [lang, setLang] = useState('');
  const [avail, setAvail] = useState('all');
  const genres = useMemo(() => [...new Set(books.map((b) => b.genre).filter(Boolean))].sort(), [books]);
  const langs = useMemo(() => [...new Set(books.map((b) => b.language).filter(Boolean))].sort(), [books]);
  const counts = {
    available: books.filter((b) => !activeFor('book', b.id)).length,
    out: books.filter((b) => activeFor('book', b.id)).length,
    overdue: books.filter((b) => isOverdue(activeFor('book', b.id))).length,
  };
  const shown = books.filter((b) => {
    const s = q.trim().toLowerCase();
    if (s && !`${b.title} ${b.author} ${b.genre}`.toLowerCase().includes(s)) return false;
    if (genre && b.genre !== genre) return false;
    if (lang && b.language !== lang) return false;
    const out = !!activeFor('book', b.id);
    if (avail === 'available' && out) return false;
    if (avail === 'out' && !out) return false;
    return true;
  });
  const chip = (active) => `shrink-0 h-9 px-3.5 rounded-full text-sm font-medium whitespace-nowrap border transition-colors ${
    active ? 'bg-stone-900 border-stone-900 text-white' : 'bg-white border-stone-200 text-stone-600 hover:border-stone-400'}`;

  return html`
    <div className="space-y-5">
      <div className="grid grid-cols-3 gap-3">
        <${StatPill} label="Available" value=${counts.available} color="emerald" />
        <${StatPill} label="On Loan" value=${counts.out} color="indigo" />
        <${StatPill} label="Overdue" value=${counts.overdue} color="rose" />
      </div>
      <div className="space-y-3">
        <div className="flex gap-2">
          <div className="relative flex-1 min-w-0">
            <span className="absolute left-3 top-1/2 -translate-y-1/2 text-stone-400 pointer-events-none"><${Icon} name="Search" size=${16} /></span>
            <input type="search" value=${q} onChange=${(e) => setQ(e.target.value)} placeholder="Search books…"
              className="w-full h-11 pl-9 pr-3 border border-stone-300 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-amber-500" />
          </div>
          <${Select} value=${avail} onChange=${(e) => setAvail(e.target.value)} className="w-[132px] shrink-0">
            <option value="all">Filter</option>
            <option value="available">Available</option>
            <option value="out">On Loan</option>
          </_>
        </div>
        <${ChipRow}>
          <button className=${chip(!genre && !lang)} onClick=${() => { setGenre(''); setLang(''); }}>All Genres</button>
          ${genres.map((g) => html`<button key=${g} className=${chip(genre === g)} onClick=${() => setGenre(genre === g ? '' : g)}>${g}</button>`)}
          ${langs.length > 1 && langs.map((l) => html`<button key=${'l' + l} className=${chip(lang === l)} onClick=${() => setLang(lang === l ? '' : l)}>${l}</button>`)}
        </_>
      </div>
      ${shown.length === 0
        ? html`<div className="text-center py-16 text-stone-400"><${Icon} name="BookOpen" size=${40} className="mx-auto mb-3 opacity-30" /><p>No books match.</p></div>`
        : html`<div className="grid grid-cols-2 gap-4">
            ${shown.map((b) => html`<${BookCard} key=${b.id} book=${b} ctx=${ctx} />`)}
          </div>`}
      <p className="text-center text-xs text-stone-400">${books.length} books</p>
    </div>`;
}

function HistoryView({ ctx, admin }) {
  const { db } = ctx;
  const [type, setType] = useState('all');
  const [itemF, setItemF] = useState('');
  const [empF, setEmpF] = useState('');
  const [status, setStatus] = useState('all');
  const [limit, setLimit] = useState(60);

  const rows = useMemo(() => {
    const all = [];
    if (type !== 'book') live(db.laptopLoans).forEach((l) => all.push({ kind: 'laptop', loan: l }));
    if (type !== 'laptop') live(db.bookLoans).forEach((l) => all.push({ kind: 'book', loan: l }));
    return all
      .filter(({ loan }) => !itemF || loan.itemId === itemF)
      .filter(({ loan }) => !empF || loan.employeeId === empF)
      .filter(({ loan }) => status === 'all' || (status === 'active' && !loan.returnedAt) ||
        (status === 'overdue' && isOverdue(loan)) || (status === 'returned' && loan.returnedAt))
      .sort((a, b) => new Date(b.loan.outAt) - new Date(a.loan.outAt));
  }, [db, type, itemF, empF, status]);

  const itemOptions = type === 'laptop' ? ctx.laptops.map((l) => [l.id, `${l.emoji} ${l.name}`])
    : type === 'book' ? ctx.books.map((b) => [b.id, b.title]) : [];

  const exportCsv = () => {
    const head = ['Type', 'Item', 'Employee', 'Out', 'Due', 'Returned', 'Days', 'Status', 'Purpose / Note'];
    const lines = rows.map(({ kind, loan }) => {
      const item = ctx.itemById(kind, loan.itemId);
      const emp = ctx.empById(loan.employeeId);
      return [kind === 'laptop' ? 'Laptop' : 'Book', itemName(kind, item), emp ? emp.name : '', dateOf(loan.outAt), loan.dueDate,
        dateOf(loan.returnedAt), daysBetween(loan.outAt, loan.returnedAt || new Date().toISOString()),
        loan.returnedAt ? 'Returned' : isOverdue(loan) ? 'Overdue' : 'Out', loan.note || ''];
    });
    const csv = [head, ...lines].map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
    a.download = `tracker-history-${today()}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
  };

  const removeRow = (kind, loan) => {
    ctx.confirm({
      title: 'Remove this entry?', body: 'It disappears from the portal but stays in the Google Sheet, marked Void.', confirmLabel: 'Remove',
      onConfirm: () => ctx.mutate('voidLoan', { kind, loanId: loan.id }, { undo: () => () => ctx.mutate('restoreLoan', { kind, loanId: loan.id }) }),
    });
  };

  const total = live(db.laptopLoans).length + live(db.bookLoans).length;
  if (total === 0)
    return html`<div className="text-center py-20 text-stone-400"><${Icon} name="History" size=${40} className="mx-auto mb-3 opacity-30" /><p>No history yet. Check out a laptop or issue a book to begin.</p></div>`;


  return html`
    <div className="space-y-4">
      <div className="grid grid-cols-2 gap-2">
        <${Select} value=${type} onChange=${(e) => { setType(e.target.value); setItemF(''); }}>
          <option value="all">All Types</option><option value="laptop">Laptops</option><option value="book">Books</option>
        </_>
        <${Select} value=${itemF} onChange=${(e) => setItemF(e.target.value)} disabled=${type === 'all'}>
          <option value="">${type === 'laptop' ? 'All Laptops' : type === 'book' ? 'All Books' : 'All Items'}</option>
          ${itemOptions.map(([id, label]) => html`<option key=${id} value=${id}>${label}</option>`)}
        </_>
        <${Select} value=${empF} onChange=${(e) => setEmpF(e.target.value)}>
          <option value="">All Employees</option>
          ${ctx.allEmployees.map((e) => html`<option key=${e.id} value=${e.id}>${e.name}${e.active === false ? ' (left)' : ''}</option>`)}
        </_>
        <${Select} value=${status} onChange=${(e) => setStatus(e.target.value)}>
          <option value="all">Any Status</option><option value="active">Still Out</option><option value="overdue">Overdue</option><option value="returned">Returned</option>
        </_>
      </div>
      <div className="flex items-center justify-between text-xs text-stone-500">
        <span>${rows.length} record${rows.length === 1 ? '' : 's'}</span>
        ${admin && html`<button onClick=${exportCsv} className="flex items-center gap-1 font-medium text-amber-700 hover:text-amber-800"><${Icon} name="Download" size=${13} /> Export CSV</button>`}
      </div>
      <div className="bg-white rounded-2xl border border-stone-200 overflow-hidden shadow-sm">
        ${rows.length === 0
          ? html`<div className="text-center py-10 text-stone-400 text-sm">No matching records.</div>`
          : rows.slice(0, limit).map(({ kind, loan }, i) => {
            const item = ctx.itemById(kind, loan.itemId);
            const emp = ctx.empById(loan.employeeId);
            const returned = !!loan.returnedAt;
            const od = isOverdue(loan);
            const duration = daysBetween(loan.outAt, returned ? loan.returnedAt : new Date().toISOString());
            const col = kind === 'laptop' ? colorOf(item && item.color) : BOOK_COLOR;
            return html`
              <div key=${loan.id} className=${`group flex items-start gap-3 p-4 ${i !== Math.min(rows.length, limit) - 1 ? 'border-b border-stone-100' : ''}`}>
                ${kind === 'book' && item
                  ? html`<div className="w-10 h-10 rounded-lg overflow-hidden shrink-0 bg-amber-50"><${Cover} book=${item} className="w-full h-full" small /></div>`
                  : html`<div className=${`${col.light} w-10 h-10 rounded-lg flex items-center justify-center text-lg shrink-0`}>${item ? item.emoji : '💻'}</div>`}
                <div className="flex-1 min-w-0">
                  <div className="flex items-baseline justify-between gap-2 flex-wrap">
                    <div className="min-w-0">
                      <span className=${`font-medium ${col.textDark}`}>${itemName(kind, item)}</span>
                      <span className="text-stone-500 text-sm"> · ${emp ? emp.name : 'Unknown'}</span>
                    </div>
                    <span className=${`text-xs px-2 py-0.5 rounded-full font-medium shrink-0 ${returned ? 'bg-stone-100 text-stone-600' : od ? 'bg-rose-100 text-rose-700' : 'bg-amber-100 text-amber-700'}`}>
                      ${returned ? `${duration}d` : od ? 'Overdue' : 'Active'}
                    </span>
                  </div>
                  <div className="text-xs text-stone-400 mt-0.5">
                    ${fmtFull(loan.outAt)} → ${returned ? fmtFull(loan.returnedAt) : html`still out <span className=${od ? 'text-rose-600' : ''}>(due ${fmt(loan.dueDate)})</span>`}
                  </div>
                  ${loan.note && html`<div className="text-xs text-stone-400 italic mt-1">"${loan.note}"</div>`}
                  ${(admin || !returned) && html`
                  <div className="flex gap-4 mt-1.5">
                    ${admin && html`<${LinkBtn} icon="Pencil" onClick=${() => ctx.setModal({ type: 'editLoan', kind, loan })}>Edit</_>`}
                    ${!returned && html`<${LinkBtn} icon="Bell" onClick=${() => ctx.openRemind(kind, loan)}>Remind</_>`}
                    ${admin && html`<${LinkBtn} icon="Trash2" onClick=${() => removeRow(kind, loan)}>Remove</_>`}

function useStats(ctx, kind) {
  const { db } = ctx;
  return useMemo(() => {
    const loans = live(db[kindTable(kind)]);
    const items = (kind === 'laptop' ? db.laptops : db.books).filter((x) => x.active !== false);
    const completed = loans.filter((c) => c.returnedAt);
    const avgDuration = completed.length
      ? (completed.reduce((s, c) => s + daysBetween(c.outAt, c.returnedAt), 0) / completed.length).toFixed(1) : '0';
    const active = loans.filter((c) => !c.returnedAt).length;
    const byItem = items.map((it, i) => ({
      id: it.id, name: kind === 'laptop' ? it.name : it.title, emoji: it.emoji || '📖', item: it,
      color: kind === 'laptop' ? colorOf(it.color).hex : CHART_COLORS[i % CHART_COLORS.length],
      count: loans.filter((c) => c.itemId === it.id).length,
    }));
    const byEmployee = db.employees
      .map((e) => ({ name: e.name, count: loans.filter((c) => c.employeeId === e.id).length }))
      .filter((e) => e.count > 0)
      .sort((a, b) => b.count - a.count);
    const last7 = Array.from({ length: 7 }, (_, i) => {
      const ds = addDays(today(), -(6 - i));
      return { day: toDate(ds).toLocaleDateString('en-IN', { weekday: 'short' }), count: loans.filter((c) => dateOf(c.outAt) === ds).length };
    });
    const genres = {};
    if (kind === 'book') loans.forEach((l) => {
      const b = db.books.find((x) => x.id === l.itemId);
      const g = (b && b.genre) || 'Other';
      genres[g] = (genres[g] || 0) + 1;
    });
    return {
      loans, items, total: loans.length, active, avgDuration, byItem, byEmployee, last7,
      byGenre: Object.entries(genres).map(([name, count], i) => ({ name, count, color: CHART_COLORS[i % CHART_COLORS.length] })).sort((a, b) => b.count - a.count),
      mostPopular: [...byItem].sort((a, b) => b.count - a.count)[0],
      topUser: byEmployee[0],
      people: new Set(loans.map((l) => l.employeeId)).size,
    };
  }, [db, kind]);
}

// E. Monthly report as a CSV: most-borrowed books, busiest laptops, late returns.
function MonthlyReport({ ctx }) {
  const [month, setMonth] = useState(today().slice(0, 7));
  const build = () => {
    const inMonth = (l) => dateOf(l.outAt).slice(0, 7) === month;
    const now = new Date().toISOString();
    const nameOf = (id) => (ctx.empById(id) || {}).name || 'Unknown';
    const count = (loans, keyFn) => {
      const m = {};
      loans.forEach((l) => { const k = keyFn(l); m[k] = m[k] || { n: 0, days: 0 }; m[k].n += 1; m[k].days += daysBetween(l.outAt, l.returnedAt || now); });
      return Object.entries(m).sort((a, b) => b[1].n - a[1].n || b[1].days - a[1].days);
    };
    const laps = live(ctx.db.laptopLoans).filter(inMonth);
    const books = live(ctx.db.bookLoans).filter(inMonth);
    const late = ['laptop', 'book'].flatMap((kind) => live(ctx.db[kindTable(kind)]).map((l) => ({ kind, l })))
      .filter(({ l }) => l.dueDate && l.dueDate.slice(0, 7) === month && (l.returnedAt ? dateOf(l.returnedAt) > l.dueDate : l.dueDate < today()));
    const lateBy = {};
    late.forEach(({ l }) => {
      const k = nameOf(l.employeeId);
      const back = l.returnedAt ? dateOf(l.returnedAt) : today();
      const d = Math.round((toDate(back) - toDate(l.dueDate)) / 86400000);
      lateBy[k] = lateBy[k] || { n: 0, days: 0 }; lateBy[k].n += 1; lateBy[k].days += d;
    });
    const label = toDate(month + '-01').toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
    const rows = [
      [APP + ' — Monthly Report', label], [],
      ['Summary'], ['Laptop checkouts', laps.length], ['Books issued', books.length], ['Late returns', late.length], [],
      ['Most-Borrowed Books', 'Times Issued', 'Days on Loan'],
      ...count(books, (l) => itemName('book', ctx.itemById('book', l.itemId))).map(([k, v]) => [k, v.n, v.days]), [],
      ['Busiest Laptops', 'Checkouts', 'Days in Use'],
      ...count(laps, (l) => itemName('laptop', ctx.itemById('laptop', l.itemId))).map(([k, v]) => [k, v.n, v.days]), [],
      ['Late Returns (Due This Month)', 'Times Late', 'Total Days Late'],
      ...Object.entries(lateBy).sort((a, b) => b[1].n - a[1].n || b[1].days - a[1].days).map(([k, v]) => [k, v.n, v.days]),
    ];
    const csv = rows.map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }));
    a.download = `marketing-library-report-${month}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
  };
  return html`
    <${Card} title="Monthly Report" sub="Most-borrowed books, busiest laptops and late returns for one month, as a CSV for Excel or Sheets.">
      <div className="flex gap-2">
        <input type="month" value=${month} max=${today().slice(0, 7)} onChange=${(e) => setMonth(e.target.value || today().slice(0, 7))} className=${inputCls + ' flex-1 min-w-0 h-11'} />
        <button onClick=${build} className="shrink-0 px-4 h-11 bg-stone-900 hover:bg-stone-800 text-white rounded-lg text-sm font-medium flex items-center gap-1.5"><${Icon} name="Download" size=${14} /> Download</button>
      </div>
    </_>`;
}

function LaptopRow({ l, ctx }) {
  const [name, setName] = useState(l.name);

  const c = colorOf(l.color);
  // Save on blur/Enter rather than every keystroke.
  const commit = () => {
    if (name.trim() === l.name && tagline.trim() === (l.tagline || '')) return;
    if (!name.trim()) return setName(l.name);
    ctx.mutate('laptopUpdate', { id: l.id, name, tagline });
  };
  const archive = () => {
    ctx.confirm({
      title: `Archive ${l.name}?`, body: 'It disappears from the board. Its history is kept.', confirmLabel: 'Archive',
      onConfirm: () => ctx.mutate('laptopArchive', { id: l.id }),
    });

  const key = (e) => e.key === 'Enter' && e.target.blur();
  return html`
    <div className=${`flex items-center gap-3 p-2.5 rounded-xl ${c.light}`}>
      <span className="text-xl">${l.emoji}</span>
      <input type="text" value=${name} onChange=${(e) => setName(e.target.value)} onBlur=${commit} onKeyDown=${key}
        className="flex-1 min-w-0 px-2 py-1 bg-white border border-stone-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-400" />
      <input type="text" value=${tagline} onChange=${(e) => setTagline(e.target.value)} onBlur=${commit} onKeyDown=${key} placeholder="Tagline"
        className="hidden w-44 px-2 py-1 bg-white/70 border border-stone-200 rounded-lg text-xs text-stone-500 focus:outline-none focus:ring-2 focus:ring-amber-400" />
      <select value=${l.color} onChange=${(e) => ctx.mutate('laptopUpdate', { id: l.id, color: e.target.value })}
        className="px-1.5 py-1 bg-white border border-stone-200 rounded-lg text-xs" title="Card colour">

      const res = await fetch(OLD_TRACKER_URL + '?t=' + Date.now());

      const out = JSON.parse(await call('api_importOld', await res.text(), ADMIN_KEY.get()));
      ctx.applyState(out.state);
      setStatus({ kind: 'done', msg: out.message });
    } catch (e) {
      setStatus({ kind: 'error', msg: e.message || 'Import failed' });

  return html`

        <button onClick=${copy} className="w-full px-4 py-2.5 bg-stone-900 hover:bg-stone-800 text-white rounded-xl font-medium flex items-center justify-center gap-2 transition-colors">
          ${copied ? html`<${Icon} name="Check" size=${16} /> Copied!` : 'Copy Link'}
        </button>
        <a href=${wa} target="_blank" rel="noopener noreferrer"
          className="w-full px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-medium flex items-center justify-center gap-2 transition-colors">
          <${Icon} name="MessageCircle" size=${16} /> Share on WhatsApp
        </a>
      </div>
    </_>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
})();
    </script>
  </body>
</html>
